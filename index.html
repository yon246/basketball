<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Hoop Flick</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #0d1117;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: 'Georgia', serif;
    overflow: hidden;
    touch-action: none;
  }
  #ui {
    width: 100%; max-width: 420px;
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 18px 6px;
    position: relative; z-index: 10;
  }
  .stat { text-align: center; }
  .stat-label { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #556; font-family: monospace; }
  .stat-val { font-size: 28px; font-weight: 700; color: #f0e6cc; line-height: 1.1; }
  .stat-val.accent { color: #ff8c2a; }
  #game-wrap {
    width: 100%; max-width: 420px;
    flex: 1; display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  #game-canvas {
    display: block;
    width: 100%;
    height: auto;
    touch-action: none;
  }
  #bottom-bar {
    width: 100%; max-width: 420px;
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 18px 12px;
  }
  #msg {
    font-size: 13px; color: #778; font-family: monospace;
    letter-spacing: 0.04em;
    flex: 1;
  }
  #reset-btn {
    font-size: 12px; letter-spacing: 0.1em;
    padding: 7px 16px;
    border: 1px solid #334;
    border-radius: 20px;
    background: transparent;
    color: #778;
    cursor: pointer;
    font-family: monospace;
  }
  #reset-btn:active { background: #1e2a36; color: #aac; border-color: #556; }
</style>
</head>
<body>

<div id="ui">
  <div class="stat"><div class="stat-label">Score</div><div class="stat-val accent" id="score-val">0</div></div>
  <div class="stat"><div class="stat-label">Streak 🔥</div><div class="stat-val" id="streak-val">0</div></div>
  <div class="stat"><div class="stat-label">Best</div><div class="stat-val" id="best-val">0</div></div>
</div>

<div id="game-wrap">
  <canvas id="game-canvas"></canvas>
</div>

<div id="bottom-bar">
  <div id="msg">Flick up toward the hoop!</div>
  <button id="reset-btn">RESET</button>
</div>

<script>
(function(){
  const canvas = document.getElementById('game-canvas');
  const ctx = canvas.getContext('2d');
  const scoreEl  = document.getElementById('score-val');
  const streakEl = document.getElementById('streak-val');
  const bestEl   = document.getElementById('best-val');
  const msgEl    = document.getElementById('msg');

  const W = 360, H = 560;
  canvas.width = W; canvas.height = H;

  function fitCanvas() {
    const maxW = Math.min(420, window.innerWidth);
    const wrap  = document.getElementById('game-wrap');
    const maxH  = wrap.clientHeight || window.innerHeight * 0.72;
    const scale = Math.min(maxW / W, maxH / H);
    canvas.style.width  = Math.round(W * scale) + 'px';
    canvas.style.height = Math.round(H * scale) + 'px';
  }
  fitCanvas();
  window.addEventListener('resize', fitCanvas);

  // ── Layout ──────────────────────────────────────────────────────
  const FLOOR_Y = H - 30;

  // Backboard — centred horizontally
  const BB_W = 110, BB_H = 72;
  const BB_X = W / 2 - BB_W / 2;   // centred
  const BB_Y = 52;

  // Rim centred under backboard; bracket drops from board's centre-bottom
  const RIM_Y     = BB_Y + BB_H + 6;   // just below board
  const RIM_WIDTH = 82;
  const RIM_LEFT  = { x: W / 2 - RIM_WIDTH / 2, y: RIM_Y };
  const RIM_RIGHT = { x: W / 2 + RIM_WIDTH / 2, y: RIM_Y };
  const RIM_CX    = W / 2;
  const RIM_R     = RIM_WIDTH / 2;   // 41 px

  // Ball — slightly smaller than rim opening (82px diam rim, 56px diam ball)
  const BALL_R = 28;
  const BALL_START = { x: W / 2, y: FLOOR_Y - BALL_R - 8 };

  // Physics
  const GRAVITY  = 0.38;
  const BOUNCE   = 0.42;
  const AIR_X    = 0.991;
  const RIM_DAMP = 0.46;

  // State
  let score = 0, streak = 0, best = 0;
  let ball  = { x: BALL_START.x, y: BALL_START.y, vx: 0, vy: 0 };
  let state = 'idle';
  let touch = null;
  let bounceCount = 0;
  let scoredTimer = 0, missedTimer = 0;
  let netAnim  = 0;
  let lastScoreCheck = false;
  let particles = [];
  let ballAngle = 0;

  function resetBall() {
    ball.x = BALL_START.x; ball.y = BALL_START.y;
    ball.vx = 0; ball.vy = 0;
    state = 'idle'; touch = null;
    bounceCount = 0; lastScoreCheck = false;
    msgEl.textContent = 'Flick up toward the hoop!';
  }

  document.getElementById('reset-btn').addEventListener('click', () => {
    score = 0; streak = 0;
    scoreEl.textContent = 0; streakEl.textContent = 0;
    particles = [];
    resetBall();
  });

  // Input
  function getPos(e) {
    const r = canvas.getBoundingClientRect();
    const sx = W / r.width, sy = H / r.height;
    const src = e.touches ? e.touches[0] : e;
    return { x: (src.clientX - r.left) * sx, y: (src.clientY - r.top) * sy };
  }

  canvas.addEventListener('mousedown',  onStart);
  canvas.addEventListener('mousemove',  onMove);
  canvas.addEventListener('mouseup',    onEnd);
  canvas.addEventListener('touchstart', onStart, { passive: false });
  canvas.addEventListener('touchmove',  onMove,  { passive: false });
  canvas.addEventListener('touchend',   onEnd,   { passive: false });

  function onStart(e) {
    if (state !== 'idle') return;
    e.preventDefault();
    const p = getPos(e);
    const dx = p.x - ball.x, dy = p.y - ball.y;
    if (Math.sqrt(dx*dx + dy*dy) < BALL_R + 28) {
      touch = { sx: p.x, sy: p.y, cx: p.x, cy: p.y, t: Date.now() };
    }
  }

  function onMove(e) {
    if (!touch || state !== 'idle') return;
    e.preventDefault();
    const p = getPos(e);
    touch.cx = p.x; touch.cy = p.y;
  }

  function onEnd(e) {
    if (!touch || state !== 'idle') return;
    e.preventDefault();

    // dy_raw: negative = finger moved UP (upward flick)
    const dy_raw = touch.cy - touch.sy;
    const dx_raw = touch.cx - touch.sx;

    if (dy_raw >= -6) {
      touch = null;
      msgEl.textContent = 'Flick upward to shoot!';
      return;
    }

    const mag   = Math.sqrt(dx_raw*dx_raw + dy_raw*dy_raw);
    const dt    = Math.max((Date.now() - touch.t) / 1000, 0.04);
    const power = Math.min((mag / dt) / 320, 1.0);

    // Ball launches opposite to drag: finger up-right → ball goes up-right
    ball.vx = (dx_raw / mag) * power * 14;
    ball.vy = (dy_raw / mag) * power * 17;  // dy_raw negative → vy negative (upward)

    state = 'flying';
    touch = null;
    msgEl.textContent = '';
  }

  // Particles
  function spawnParticles(x, y) {
    const cols = ['#ff8c2a','#ffd166','#ff4d6d','#ffffff','#51cf66'];
    for (let i = 0; i < 22; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = 2.5 + Math.random() * 5.5;
      particles.push({
        x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s - 3.5,
        life: 1, decay: 0.022 + Math.random()*0.018,
        r: 2 + Math.random()*3.5,
        color: cols[Math.floor(Math.random()*cols.length)]
      });
    }
  }

  // Physics
  function update() {
    if (state === 'flying' || state === 'scored') {
      ball.vy += GRAVITY;
      ball.vx *= AIR_X;
      ball.x  += ball.vx;
      ball.y  += ball.vy;
      ballAngle += ball.vx * 0.055;

      [RIM_LEFT, RIM_RIGHT].forEach(rim => {
        const dx = ball.x - rim.x, dy = ball.y - rim.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        const minD = BALL_R + 5;
        if (dist < minD && dist > 0) {
          const nx = dx/dist, ny = dy/dist;
          const dot = ball.vx*nx + ball.vy*ny;
          ball.vx = (ball.vx - 2*dot*nx) * RIM_DAMP;
          ball.vy = (ball.vy - 2*dot*ny) * RIM_DAMP;
          ball.x  = rim.x + nx*(minD + 1);
          ball.y  = rim.y + ny*(minD + 1);
          bounceCount++;
        }
      });

      if (state === 'flying') {
        const inX = ball.x > RIM_LEFT.x + 8 && ball.x < RIM_RIGHT.x - 8;
        const inY = ball.y > RIM_Y - 4 && ball.y < RIM_Y + 38;
        const nowScore = inX && inY && ball.vy > 0;
        if (nowScore && !lastScoreCheck) {
          const pts = bounceCount === 0 ? 3 : bounceCount === 1 ? 2 : 1;
          score += pts; streak++;
          if (streak > best) best = streak;
          scoreEl.textContent = score;
          streakEl.textContent = streak;
          bestEl.textContent = best;
          scoredTimer = 95; netAnim = 1;
          spawnParticles(RIM_CX, RIM_Y + 10);
          msgEl.textContent = (bounceCount === 0 ? `SWISH! +${pts}` : `+${pts} pt${pts>1?'s':''}`) +
                              (streak >= 3 ? '  🔥×'+streak : '');
          state = 'scored';
        }
        lastScoreCheck = nowScore;
      }

      if (ball.y + BALL_R >= FLOOR_Y) {
        ball.y  = FLOOR_Y - BALL_R;
        ball.vy = -Math.abs(ball.vy) * BOUNCE;
        ball.vx *= 0.80; bounceCount++;
        if (Math.abs(ball.vy) < 1.2) {
          ball.vy = 0; ball.vx = 0;
          if (state !== 'scored') {
            state = 'missed'; streak = 0; streakEl.textContent = 0;
            missedTimer = 80; msgEl.textContent = 'Missed! Flick again.';
          } else { scoredTimer = 0; }
        }
      }
      if (ball.x - BALL_R < 0)  { ball.x = BALL_R;     ball.vx =  Math.abs(ball.vx)*BOUNCE; }
      if (ball.x + BALL_R > W)  { ball.x = W-BALL_R;   ball.vx = -Math.abs(ball.vx)*BOUNCE; }
      if (ball.y - BALL_R < 0)  { ball.y = BALL_R;     ball.vy =  Math.abs(ball.vy)*BOUNCE; }

      if (state === 'scored') { scoredTimer--; if (scoredTimer <= 0) resetBall(); }
    }

    if (state === 'missed') { missedTimer--; if (missedTimer <= 0) resetBall(); }
    if (netAnim > 0) netAnim = Math.max(0, netAnim - 0.032);
    particles = particles.filter(p => p.life > 0);
    particles.forEach(p => { p.x+=p.vx; p.y+=p.vy; p.vy+=0.22; p.life-=p.decay; });
  }

  // Draw helpers
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r);
    ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
    ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r);
    ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r);
    ctx.closePath();
  }

  function drawBg() {
    const g = ctx.createLinearGradient(0,0,0,H*0.7);
    g.addColorStop(0,'#0c1a28'); g.addColorStop(1,'#0f2440');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H*0.7);
    ctx.fillStyle='#7a3e10'; ctx.fillRect(0,FLOOR_Y-6,W,H);
    ctx.fillStyle='#8f4e18'; ctx.fillRect(0,FLOOR_Y-6,W,8);
    ctx.strokeStyle='rgba(255,190,100,0.15)'; ctx.lineWidth=1.5; ctx.setLineDash([8,6]);
    ctx.beginPath(); ctx.moveTo(W/2-85,FLOOR_Y-6); ctx.lineTo(W/2-85,H); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(W/2+85,FLOOR_Y-6); ctx.lineTo(W/2+85,H); ctx.stroke();
    ctx.setLineDash([]);
    ctx.strokeStyle='rgba(255,190,100,0.12)'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(W/2,FLOOR_Y-6,75,Math.PI,0); ctx.stroke();
  }

  function drawBackboard() {
    // Vertical pole from top of canvas down to backboard
    ctx.strokeStyle='#2a3a4a'; ctx.lineWidth=6; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(W/2, 0); ctx.lineTo(W/2, BB_Y); ctx.stroke();

    // Board
    ctx.fillStyle='#c8ddef'; ctx.strokeStyle='#8899aa'; ctx.lineWidth=2;
    roundRect(BB_X, BB_Y, BB_W, BB_H, 3); ctx.fill(); ctx.stroke();

    // Sheen
    ctx.fillStyle='rgba(255,255,255,0.16)';
    roundRect(BB_X+2, BB_Y+2, 46, 16, 2); ctx.fill();

    // Target box — centred on board
    ctx.strokeStyle='#cc2020'; ctx.lineWidth=2.5;
    ctx.strokeRect(BB_X + BB_W/2 - 18, BB_Y + BB_H - 40, 36, 32);
  }

  function drawRim() {
    // Bracket: drops from centre-bottom of backboard to rim level
    ctx.strokeStyle='#bb3800'; ctx.lineWidth=5; ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(W/2, BB_Y + BB_H);
    ctx.lineTo(W/2, RIM_Y);
    ctx.stroke();

    // Rim bar
    ctx.strokeStyle='#e04400'; ctx.lineWidth=6; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(RIM_LEFT.x, RIM_Y); ctx.lineTo(RIM_RIGHT.x, RIM_Y); ctx.stroke();

    // End caps
    ctx.fillStyle='#cc3300';
    [RIM_LEFT, RIM_RIGHT].forEach(r => { ctx.beginPath(); ctx.arc(r.x,r.y,5,0,Math.PI*2); ctx.fill(); });

    // Underside shadow
    ctx.fillStyle='rgba(0,0,0,0.22)';
    ctx.beginPath(); ctx.ellipse(RIM_CX, RIM_Y+6, RIM_R, 5, 0, 0, Math.PI*2); ctx.fill();
  }

  function drawNet() {
    const sw=Math.sin(netAnim*Math.PI*5)*netAnim*10, netH=54, segs=8;
    ctx.strokeStyle='rgba(230,230,230,0.72)'; ctx.lineWidth=0.9;
    for (let i=0; i<=segs; i++) {
      const t=i/segs, tx=RIM_LEFT.x+t*RIM_WIDTH, bx=tx+sw*(1-Math.abs(t-0.5)*2);
      ctx.beginPath(); ctx.moveTo(tx,RIM_Y+4);
      ctx.quadraticCurveTo(tx+sw*0.4, RIM_Y+netH*0.55, bx, RIM_Y+netH); ctx.stroke();
    }
    for (let j=1; j<=4; j++) {
      const fy=j/4; ctx.beginPath();
      for (let i=0; i<=segs; i++) {
        const t=i/segs, tx=RIM_LEFT.x+t*RIM_WIDTH, bx=tx+sw*(1-Math.abs(t-0.5)*2);
        const px=tx+(bx-tx)*fy+sw*fy*0.4, py=RIM_Y+fy*netH;
        i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
      }
      ctx.stroke();
    }
  }

  function drawBall() {
    const x=ball.x, y=ball.y, r=BALL_R;
    const distToFloor=Math.max(0,FLOOR_Y-y-r);
    ctx.save(); ctx.globalAlpha=Math.max(0,0.38*(1-distToFloor/400)); ctx.fillStyle='#000';
    ctx.beginPath(); ctx.ellipse(x,FLOOR_Y-4,r*(1-distToFloor/500),5,0,0,Math.PI*2); ctx.fill(); ctx.restore();

    ctx.save(); ctx.translate(x,y); ctx.rotate(ballAngle);
    const bg=ctx.createRadialGradient(-r*0.2,-r*0.2,r*0.1,0,0,r);
    bg.addColorStop(0,'#f08828'); bg.addColorStop(1,'#c04a00');
    ctx.fillStyle=bg; ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(255,220,130,0.28)'; ctx.beginPath(); ctx.arc(-r*0.25,-r*0.28,r*0.4,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='rgba(15,4,0,0.65)'; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(-r,0); ctx.lineTo(r,0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,-r); ctx.lineTo(0,r); ctx.stroke();
    ctx.beginPath(); ctx.arc(0,0,r,-Math.PI*0.15,Math.PI*0.85); ctx.stroke();
    ctx.beginPath(); ctx.arc(0,0,r, Math.PI*0.85,Math.PI*1.85); ctx.stroke();
    ctx.restore();
  }

  function drawAimGuide() {
    if (!touch || state !== 'idle') return;
    const dx=touch.cx-touch.sx, dy=touch.cy-touch.sy;
    if (dy >= 0) return;
    const mag=Math.sqrt(dx*dx+dy*dy), power=Math.min(mag/70,1);
    const lvx=(-dx/mag)*power*14, lvy=(dy/mag)*power*17;

    // Trajectory preview
    ctx.save(); ctx.globalAlpha=0.36; ctx.strokeStyle='#ffd166';
    ctx.lineWidth=1.6; ctx.setLineDash([5,5]); ctx.beginPath();
    let px=ball.x,py=ball.y,pvx=lvx*0.52,pvy=lvy*0.52; ctx.moveTo(px,py);
    for(let i=0;i<34;i++){pvx*=AIR_X;pvy+=GRAVITY;px+=pvx;py+=pvy;if(py>FLOOR_Y||px<0||px>W)break;ctx.lineTo(px,py);}
    ctx.stroke(); ctx.setLineDash([]); ctx.restore();

    // Arrow
    const arrowDX=lvx/Math.abs(lvy||1), arrowDY=lvy/Math.abs(lvy||1);
    const aLen=Math.min(mag*0.55,52);
    const ex=ball.x+arrowDX*aLen, ey=ball.y+arrowDY*aLen;
    const col=power>0.75?'#ff4d6d':power>0.42?'#ff8c2a':'#51cf66';
    ctx.save(); ctx.globalAlpha=0.88;
    ctx.strokeStyle=col; ctx.lineWidth=2.5; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(ball.x,ball.y); ctx.lineTo(ex,ey); ctx.stroke();
    const ang=Math.atan2(ey-ball.y,ex-ball.x);
    ctx.fillStyle=col; ctx.beginPath();
    ctx.moveTo(ex,ey);
    ctx.lineTo(ex-12*Math.cos(ang-0.42),ey-12*Math.sin(ang-0.42));
    ctx.lineTo(ex-12*Math.cos(ang+0.42),ey-12*Math.sin(ang+0.42));
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle=col; ctx.lineWidth=3.5;
    ctx.beginPath(); ctx.arc(ball.x,ball.y,BALL_R+9,-Math.PI/2,-Math.PI/2+power*Math.PI*2); ctx.stroke();
    ctx.restore();
  }

  function drawHint() {
    if (state!=='idle'||touch) return;
    const pulse=0.45+0.3*Math.sin(Date.now()/360);
    ctx.save(); ctx.globalAlpha=pulse; ctx.strokeStyle='#ffd166'; ctx.lineWidth=1.8; ctx.setLineDash([4,3]);
    ctx.beginPath(); ctx.moveTo(ball.x,ball.y-BALL_R-6); ctx.lineTo(ball.x,ball.y-BALL_R-30); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle='#ffd166'; ctx.beginPath();
    ctx.moveTo(ball.x,ball.y-BALL_R-35); ctx.lineTo(ball.x-6,ball.y-BALL_R-23); ctx.lineTo(ball.x+6,ball.y-BALL_R-23);
    ctx.closePath(); ctx.fill(); ctx.restore();
  }

  function drawScoreEffect() {
    if (state!=='scored'||scoredTimer<=0) return;
    const alpha=Math.min(scoredTimer/22,1), rise=(95-scoredTimer)*0.22;
    ctx.save(); ctx.globalAlpha=alpha; ctx.fillStyle='#ffd166'; ctx.font='bold 28px Georgia'; ctx.textAlign='center';
    ctx.fillText(bounceCount===0?'SWISH!':'NICE!', W/2, RIM_Y-32-rise); ctx.restore();
  }

  function drawParticles() {
    particles.forEach(p => {
      ctx.save(); ctx.globalAlpha=p.life; ctx.fillStyle=p.color;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill(); ctx.restore();
    });
  }

  function loop() {
    update(); ctx.clearRect(0,0,W,H);
    drawBg(); drawBackboard(); drawNet(); drawRim();
    drawAimGuide(); drawHint(); drawBall(); drawParticles(); drawScoreEffect();
    requestAnimationFrame(loop);
  }
  loop();
})();
</script>
</body>
</html>
